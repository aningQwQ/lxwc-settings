[package]
name = "lxwc-settings"
version = "0.1.0"
edition = "2021"
description = "Labwc + LXQt lightweight settings center"

[dependencies]
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow", "wayland"] }
egui = "0.28"
quick-xml = "0.41"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
