[package]
name = "lxwc-settings"
version = "1.4.0"
edition = "2021"
description = "Labwc + LXQt lightweight settings center"
license = "GPL-3.0-or-later"
repository = "https://github.com/aningQwQ/lxwc-settings"

[dependencies]
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow", "wayland"] }
egui = "0.28"
egui_extras = { version = "0.28", default-features = false }
quick-xml = "0.41"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
